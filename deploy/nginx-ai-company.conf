# AI Company behind nginx. Copy to /etc/nginx/sites-available/ai-company and enable.
#   9443: the office UI + API (login required, enforced by the app)
#   9444: project previews only, on their own origin so code written by the AI
#         cannot call the admin API with the chairman's session.
# __HOST__ and __CERT__ are filled in by setup-server.sh.

map $http_upgrade $aico_connection {
    default upgrade;
    ''      close;
}

server {
    listen 9443 ssl http2;
    listen [::]:9443 ssl http2;
    server_name __HOST__;

    ssl_certificate     /etc/letsencrypt/live/__CERT__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERT__/privkey.pem;

    client_max_body_size 300m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Previews are only served from the preview origin.
    location /preview/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $aico_connection;
        proxy_set_header Host $http_host;
        # Always overwritten here: the app trusts it to tell proxied from local requests.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 9444 ssl http2;
    listen [::]:9444 ssl http2;
    server_name __HOST__;

    ssl_certificate     /etc/letsencrypt/live/__CERT__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERT__/privkey.pem;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    # Only the office UI may frame a preview.
    add_header Content-Security-Policy "frame-ancestors https://__HOST__:9443" always;

    location /preview/ {
        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
    }

    location / { return 404; }
}
