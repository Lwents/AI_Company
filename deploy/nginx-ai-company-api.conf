
# Same UI/API under a host name with its own certificate. Cloudflare Pages Functions forward
# /api, /ws, /login and /portal here (Cloudflare does not fetch bare IP addresses).
server {
    listen 9443 ssl http2;
    listen [::]:9443 ssl http2;
    server_name __API_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__API_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__API_HOST__/privkey.pem;

    client_max_body_size 100m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    location /preview/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $aico_connection;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
